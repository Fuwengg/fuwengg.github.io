<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>果冻骰子实验 · 超频视界</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eee9dd;color:#292622;font:18px system-ui}canvas{display:block;width:100%;height:100%}header{position:absolute;top:5%;left:7%;pointer-events:none}small{color:#a53838;letter-spacing:.12em}h1{font-family:SimSun,serif;font-size:clamp(34px,6vw,64px);margin:.25em 0}p{font-size:16px}section{position:absolute;bottom:5%;left:5%;right:5%;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button,label{border:1px solid #48443d;border-radius:22px;background:#faf5e9;padding:12px 20px;font:inherit;cursor:pointer}button.active,#bounce{background:#f2d958}label{display:flex;gap:10px;align-items:center;font-size:15px}input{width:90px}#status{font-size:15px;color:#8c4745;margin-top:10px}</style>
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js"}}</script>
<header><small>超频视界 · 可玩原型</small><h1>果冻骰子实验</h1><p>点一下，让它弹起来</p><div id="status">正在准备骰子</div></header><canvas id="view"></canvas>
<section><button id="pink" class="active">草莓粉</button><button id="green">青柠绿</button><button id="blue">葡萄紫</button><button id="bounce">弹一下</button><label>软一点<input id="soft" type="range" min="0" max="1" step=".05" value=".55"></label></section>
<script type="module">
import * as T from 'three';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.toneMapping=T.ACESFilmicToneMapping;
const scene=new T.Scene();scene.background=new T.Color('#eee9dd');const camera=new T.PerspectiveCamera(36,1,.1,100);camera.position.set(3.5,3.6,5.7);camera.lookAt(0,.8,0);
scene.add(new T.HemisphereLight(0xffffff,0xb8a28b,2.3));for(const [x,y,z] of [[-3,6,4],[4,4,-3]]){const light=new T.DirectionalLight(0xffffff,3);light.position.set(x,y,z);light.castShadow=true;scene.add(light)}
const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:'#eee9dd',roughness:.8}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const root=new T.Group();scene.add(root);const shape=new T.Shape(),r=.18,a=.63;shape.moveTo(-a+r,-a);shape.lineTo(a-r,-a);shape.quadraticCurveTo(a,-a,a,-a+r);shape.lineTo(a,a-r);shape.quadraticCurveTo(a,a,a-r,a);shape.lineTo(-a+r,a);shape.quadraticCurveTo(-a,a,-a,a-r);shape.lineTo(-a,-a+r);shape.quadraticCurveTo(-a,-a,-a+r,-a);
const geo=new T.ExtrudeGeometry(shape,{depth:1.1,bevelEnabled:true,bevelSize:.14,bevelThickness:.14,bevelSegments:6,steps:1,curveSegments:10});geo.center();geo.computeVertexNormals();
const material=new T.MeshPhysicalMaterial({color:0xf38fae,roughness:.15,transmission:.48,thickness:1,ior:1.36,clearcoat:1});const body=new T.Mesh(geo,material);body.castShadow=true;root.add(body);
const layouts={1:[[0,0]],2:[[-.3,-.3],[.3,.3]],3:[[-.3,-.3],[0,0],[.3,.3]],4:[[-.3,-.3],[-.3,.3],[.3,-.3],[.3,.3]],5:[[-.3,-.3],[-.3,.3],[0,0],[.3,-.3],[.3,.3]],6:[[-.3,-.34],[-.3,0],[-.3,.34],[.3,-.34],[.3,0],[.3,.34]]};
const dotMat=new T.MeshStandardMaterial({color:0xfff2d7,roughness:.25});for(const [number,axis,sign] of [[1,1,1],[6,1,-1],[2,2,1],[5,2,-1],[3,0,1],[4,0,-1]])for(const [u,v] of layouts[number]){const dot=new T.Mesh(new T.SphereGeometry(.085,16,10),dotMat),p=[0,0,0],axes=[0,1,2].filter(i=>i!==axis);p[axis]=sign*.772;p[axes[0]]=u;p[axes[1]]=v;dot.position.fromArray(p);dot.scale.setComponent(axis,.18);root.add(dot)}
let started=-10,soft=.55;const status=document.querySelector('#status');function bounce(){started=performance.now()/1000;status.textContent='弹起来，再慢慢停住'}document.querySelector('#bounce').onclick=bounce;document.querySelector('#view').onclick=bounce;
for(const [key,color,label] of [['pink',0xf38fae,'草莓粉'],['green',0xafd76a,'青柠绿'],['blue',0x9e86e9,'葡萄紫']])document.getElementById(key).onclick=()=>{material.color.setHex(color);document.querySelectorAll('section button').forEach(b=>b.classList.remove('active'));document.getElementById(key).classList.add('active');status.textContent='已换成'+label;bounce()};
document.querySelector('#soft').oninput=e=>{soft=+e.target.value;bounce()};function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.position.set(3.5,3.6,camera.aspect<1?8:5.7);camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function frame(ms){requestAnimationFrame(frame);const t=ms/1000-started,h=t<.65&&t>=0?.85*Math.sin(t/.65*Math.PI):0,u=Math.max(0,t-.65),w=t>=.65?soft*.48*Math.exp(-u*3)*Math.cos(u*19):0;root.position.set(0,.79*(1-w)+h,0);root.scale.set(1+w*.55,1-w,1+w*.55);root.rotation.y=.35+Math.sin(ms/2800)*.16;renderer.render(scene,camera)}requestAnimationFrame(frame);status.textContent='草莓粉 · 点一下试试';
</script></html>
