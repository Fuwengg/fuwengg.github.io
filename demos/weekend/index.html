<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>周末充电方式｜12题原创趣味测试</title><style>*{box-sizing:border-box}html{background:#f6f4ec;color:#203b32;font-family:system-ui,"Microsoft YaHei",sans-serif}body{margin:0}main{max-width:650px;margin:auto;padding:28px 20px 44px}header{display:flex;justify-content:space-between;font-size:12px;letter-spacing:2px;border-bottom:1px solid #cdd5c7;padding-bottom:18px}h1{font-size:clamp(34px,8vw,52px);line-height:1.15;margin:30px 0 20px;letter-spacing:-1px}h2{font-size:26px;line-height:1.4}p,li{line-height:1.85}small,.muted{color:#59685f;font-size:13px}button,a.button{font:inherit;cursor:pointer;border-radius:14px;padding:15px 18px;border:1px solid #80988b;background:transparent;color:#203b32;min-height:48px;text-decoration:none;display:inline-block}button:focus-visible,a:focus-visible{outline:3px solid #b97140;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary{background:#244e3d!important;color:white!important;border-color:#244e3d!important}.card{background:#fffef8;border:1px solid #d6ddce;padding:24px;border-radius:22px;margin:22px 0}.pill{display:inline-block;border:1px solid #a9b8aa;border-radius:30px;padding:7px 12px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{display:block;width:100%;text-align:left;margin:10px 0;background:#fffef8}.option[aria-checked=true]{background:#e2ebdb;border:2px solid #326854}progress{width:100%;accent-color:#326854;height:9px;margin:20px 0}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.actions{display:flex;gap:10px;flex-wrap:wrap}#resultCard{border-top:7px solid var(--accent,#326854)}.step{border-bottom:1px solid #dbe0d2;padding:12px 0}.score{display:flex;justify-content:space-between;margin:8px 0;font-size:14px}.seal{width:100px;height:100px;display:grid;place-items:center;border:1px solid #718774;border-radius:50%;float:right;transform:rotate(10deg);margin:10px 0 16px 12px;font-size:14px}.foot{border-top:1px solid #cdd5c7;padding-top:16px;margin-top:32px}@media(max-width:360px){main{padding:20px 14px}.card{padding:18px}}@media print{header,.actions,.foot,button{display:none}main{padding:0;max-width:none}.card{margin:0;border:0}body{font-size:12px}h1{font-size:30px}}</style></head><body><main><header><span>周末留一点空</span><span>WEEKEND / 01</span></header><div id="app"></div><footer class="foot muted">原创生活情境趣味测试 · v1.0<br>仅供娱乐与日常自我探索，不提供心理或医疗诊断。</footer></main><script>const Q=[["周六醒来，没有必须完成的事。你最想先做什么？",["关掉消息，慢慢吃早餐","约一个聊得来的人见面","去附近没走过的小路看看","整理桌面，给今天留点空间"]],["连续忙了五天，哪种安排最让你松口气？",["独处一下午，不解释行程","和熟人吃顿不用赶时间的饭","换个环境，随意走走","把一直惦记的小事收个尾"]],["朋友临时取消约定，多出来的两小时你会怎样用？",["在家读几页书或听音乐","问问另一个熟人是否有空聊天","出门看看当下想去哪","完成一个小手作或整理抽屉"]],["周末只剩半天，哪种结束方式更合心意？",["安安静静，早一点收工","与在乎的人交换这一周的近况","找一处风景坐一坐","把下周要用的东西准备好"]],["如果休息日有一种声音，你更想听到哪种？",["低低的音乐，或没有声音","熟人的笑声和慢慢的交谈","风吹树叶、街头和脚步声","做饭、翻纸、摆放物品的声音"]],["面对一个空白下午，你更愿意给它加上什么？",["一段不会被打断的留白","一次可以认真说话的相聚","一个没去过但不必远行的地点","一件能在当天完成的小作品"]],["哪种周末活动最容易让你中途失去兴致？",["需要一直回应的密集聚会","整天没有人可以分享感受","每一小时都在重复熟悉流程","忙了很久却看不到具体变化"]],["你想给自己一点小小的奖励，会倾向哪一种？",["一小时不看通知的自在","与喜欢的人一起做顿简单的饭","在生活半径里发现一个新角落","把一件旧物修好或重新布置"]],["下雨，原定的户外安排取消了。你更愿意？",["靠窗坐着，允许自己发呆","邀请熟人线上聊天或一起看电影","在室内试一种新体验","用现有材料做一道菜或一张卡片"]],["回想一次舒服的周末，你更在意哪一刻？",["终于不用随时接住外界的信息","被认真听见，也听懂了对方","看见与平日不同的风景","亲手完成了一件小事"]],["如果只能为周末留一个小时，你想保护哪一种时间？",["不用安排给任何人的独处","与重要的人认真相处","不设目的地的探索","专心做一件小事"]],["此刻选一个最想带进周末的词。",["安静","连接","新鲜","踏实"]]], TYPES=[{"name":"静音留白型","tag":"把回应的音量，调低一点","color":"#326854","desc":"这次选择里，你较常靠近安静、独处和不被打断的时间。周末可以从少安排一件事开始，给注意力留一个不用回应的角落。","steps":["周六上午｜留 30 分钟给早餐，先不打开消息列表。","周六下午｜任选阅读、听音乐或发呆，做 40 分钟就可以。","周日上午｜走一段熟悉的路，不用记录也不用分享。","周日傍晚｜用 10 分钟准备明天，再留出自由时间。"],"tiny":"只剩 20 分钟：把通知放一边，坐下喝点水，做一件不需要回应别人的事。","rain":"雨天方案：在家选一小块舒服的位置，读几页书或听一段熟悉的音乐。","boundary":"给自己的边界：提前告诉熟人这段时间晚些回复；有必要的联系可以保留。","prompt":"下次再安排时问自己：哪一项其实可以不做？"},{"name":"熟人共鸣型","tag":"把时间，留给聊得来的人","color":"#a7503b","desc":"这次选择里，你更常把轻松的相处、分享和被倾听放在前面。比起把聚会排满，可以优先选一次不用表演、也不必赶场的见面。","steps":["周六上午｜问一位熟人是否愿意慢慢聊一会儿，给对方拒绝的空间。","周六下午｜一起散步或做顿家常饭，只安排这一件事。","周日上午｜交换一件这周的小事，轮流听完再回应。","周日傍晚｜结束相聚后留半小时独处，感受自己的节奏。"],"tiny":"只剩 20 分钟：向熟人发出一次不催回复的聊天邀请，或者写下一件想分享的小事。","rain":"雨天方案：通话、一起听歌，或在各自家中做一道同样的简单菜。","boundary":"给自己的边界：相处不等于接住所有情绪；累了可以约定下次再聊。","prompt":"下次再安排时问自己：我想见的是谁，而不是要参加多少场？"},{"name":"漫游换景型","tag":"在熟悉的生活里，转个弯","color":"#385e92","desc":"这次选择里，你较常靠近新鲜感、风景和一点点探索。无需远行或消费，也可以给熟悉的生活换一个观察角度。","steps":["周六上午｜选一条步行可达的新路线，先看看天气和开放时间。","周六下午｜慢走 30 分钟，留意三样平时没注意的东西。","周日上午｜用纸笔记录一个新发现，或者在家尝试一种新做法。","周日傍晚｜早点返程，给下周留出准备时间。"],"tiny":"只剩 20 分钟：在安全熟悉的范围里换条路走，看看天空和路边的细节。","rain":"雨天方案：在家翻一本没读过的书，或换一种方式摆放熟悉的小物。","boundary":"给自己的边界：不用为了新鲜赶行程；交通、天气和体力合适再出门。","prompt":"下次再安排时问自己：附近有什么我还没认真看过？"},{"name":"小事落地型","tag":"用一个小完成，收回节奏","color":"#876025","desc":"这次选择里，你更常靠近动手、整理和看得见的小变化。可以选择一件足够小的事，让完成感服务休息，别让清单占满周末。","steps":["周六上午｜选一个抽屉、一顿饭或一页手帐，只选其中一项。","周六下午｜设 30 分钟，到点就停，允许只完成一部分。","周日上午｜欣赏已经发生的小变化，不急着加新任务。","周日傍晚｜花 10 分钟准备一件下周需要的物品，然后收工。"],"tiny":"只剩 20 分钟：整理一小块桌面，或把明天要带的物品放在一起。","rain":"雨天方案：用现有食材做一餐、修补一件小物，或者写一张手写卡片。","boundary":"给自己的边界：休息不用靠产出来证明；做不完也可以结束。","prompt":"下次再安排时问自己：我能把这件事缩小到什么程度？"}];
let answers=Array(Q.length).fill(null),pos=-1;
function score(a){if(a.length!==Q.length||a.some(x=>!Number.isInteger(x)||x<0||x>3))throw Error('请先答完12题');const counts=[0,0,0,0];a.forEach(x=>counts[x]++);const max=Math.max(...counts);return{counts,winners:counts.map((n,i)=>n===max?i:-1).filter(i=>i>=0)}}
window.quiz={score,questions:Q,types:TYPES};
const app=document.getElementById('app');
function home(){pos=-1;app.innerHTML='<span class="seal">周末<br>留一点空</span><p class="muted">给想好好休息的你</p><h1>这个周末，<br>怎样给自己<br>充个电？</h1><p>12 个生活情境，看看此刻你更想靠近哪一种休息方式。把答案变成一张可保存的周末安排卡。</p><div class="grid"><span class="pill">12 题 · 约 3 分钟</span><span class="pill">4 种安排 · 可重测</span></div><div class="card"><b>没有标准答案，也没有固定人设。</b><p>按最近一周的感受选择最接近的一项。结果只描述本次选择，不代表人格、心理状态或专业评估。允许并列，也允许下周不一样。</p><button class="primary" onclick="start()">开始我的周末测试 →</button></div><small>无需登录。答案仅在当前页面内存中，刷新即清空，不上传。离线单文件无外部依赖；在线访问若未来启用，托管服务可能记录常规访问日志。</small>'}
function start(){answers=Array(Q.length).fill(null);pos=0;render()}
function render(){const q=Q[pos];app.innerHTML='<p class="muted">周末充电方式 · 完整版</p><progress value="'+(pos+1)+'" max="12" aria-label="答题进度"></progress><p>第 '+(pos+1)+' / 12 题</p><h2 tabindex="-1" id="question">'+q[0]+'</h2><div role="radiogroup" aria-labelledby="question">'+q[1].map((v,i)=>'<button class="option" role="radio" aria-checked="'+(answers[pos]===i)+'" data-choice="'+i+'" onclick="choose('+i+')">'+String.fromCharCode(65+i)+' · '+v+'</button>').join('')+'</div><div class="nav"><button onclick="back()" '+(pos===0?'disabled':'')+'>← 上一题</button><button id="next" class="primary" onclick="next()" '+(answers[pos]===null?'disabled':'')+'>'+(pos===11?'查看我的结果':'下一题 →')+'</button></div><p class="muted">可以回退修改；每题只计一票。</p>';document.getElementById('question').focus()}
function choose(i){answers[pos]=i;document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-checked',Number(b.dataset.choice)===i));document.getElementById('next').disabled=false}
function next(){if(answers[pos]===null)return;if(pos<11){pos++;render()}else result()}
function back(){if(pos>0){pos--;render()}}
function result(){const s=score(answers);app.innerHTML='<p class="muted">你的周末充电方式 · 本次选择</p><section id="resultCard" class="card" style="--accent:'+TYPES[s.winners[0]].color+'"><span class="pill">'+(s.winners.length>1?'混合充电 · 并列偏好':'这次更靠近')+'</span><h1 style="font-size:34px">'+s.winners.map(i=>TYPES[i].name).join(' × ')+'</h1><p>'+(s.winners.length>1?'你的最高票并列。不强行选出一个标签：从下面每种方式里各挑一件，或先做今天最想做的那件。':'把它当作一份休息提案，你随时可以按实际情况修改。')+'</p>'+s.counts.map((n,i)=>'<div class="score"><span>'+TYPES[i].name+'</span><b>'+n+' / 12 票</b></div>').join('')+s.winners.map(i=>{const t=TYPES[i];return '<h2>'+t.name+'</h2><b>'+t.tag+'</b><p>'+t.desc+'</p>'+t.steps.map(x=>'<div class="step">'+x+'</div>').join('')+'<p>'+t.tiny+'</p><p>'+t.rain+'</p><p>'+t.boundary+'</p><p><b>'+t.prompt+'</b></p>'}).join('')+'<small>计分：每题四个选项分别对应四种方式，每次选择加 1 票；最高票为本次结果，最高票相同则全部展示。票数不是概率或心理测量分数。安排均可用已有物品完成，不要求消费。仅供娱乐和日常自我探索。</small></section><div class="actions"><button class="primary" onclick="saveResultImage()">保存一页结果图片</button><button onclick="downloadCard()">保存结果文字卡</button><button onclick="window.print()">打印 / 保存 PDF</button><button onclick="pos=11;render()">返回修改</button><button onclick="start()">重新测试</button></div><p class="muted" id="saveHint" role="status">可直接截屏保存；长结果可用浏览器长截图。下载后答案不会自动留存。</p>';window.scrollTo(0,0)}
function downloadCard(){const text=document.getElementById('resultCard').innerText;const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='我的周末充电卡.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);document.getElementById('saveHint').textContent='已请求下载文字卡；若浏览器未弹出保存，请截图，或使用打印 / 保存 PDF。'}
home();
function saveResultImage(){
 const s=score(answers),c=document.createElement('canvas');c.width=1080;c.height=1440;
 const g=c.getContext('2d');g.fillStyle='#f6f4ec';g.fillRect(0,0,1080,1440);
 let y=85;g.fillStyle='#244e3d';g.textBaseline='top';
 function line(text,size=30,gap=45){g.font=size+'px "Microsoft YaHei", sans-serif';let row='';for(const ch of text){if(g.measureText(row+ch).width>916){g.fillText(row,82,y);y+=gap;row=ch}else row+=ch}if(row){g.fillText(row,82,y);y+=gap}}
 line('周末留一点空 / 我的充电卡',25,40);y+=34;
 line(s.winners.length>1?'这次，我想混合充电。':'这次，我更靠近',48,65);y+=20;
 line(s.winners.map(i=>TYPES[i].name).join(' × '),36,52);y+=18;
 line(s.counts.map((n,i)=>['静音','共鸣','漫游','落地'][i]+' '+n+'票').join('    '),25,40);y+=22;
 for(const i of s.winners){const t=TYPES[i];line(t.name+' / '+t.tag,29,43);line(t.tiny,27,39);if(s.winners.length===1){y+=15;for(const step of t.steps)line(step,28,43);y+=15;line(t.rain,27,40);line(t.boundary,27,40)}y+=20}
 const end=y;if(end>1300)throw Error('结果卡内容超出一页');
 y=1310;line('最高票并列全部保留。票数不是概率；下次可以不一样。',23,34);line('原创趣味测试 · 娱乐与日常自我探索 · 不作专业诊断',23,34);
 c.toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='我的周末充电卡.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);document.getElementById('saveHint').textContent='已请求保存一页PNG结果卡；若手机未下载，请截图保存。'},'image/png');
 return {width:c.width,height:c.height,contentBottom:end};
}

</script></body></html>
