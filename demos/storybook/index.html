<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小狐狸借星光 · 互动绘本</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eee7d9;color:#252821;font-family:"Microsoft YaHei",sans-serif}main{max-width:1000px;margin:auto;min-height:100vh;padding:24px 24px 40px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #bcb8a8;padding:0 0 16px}header b{font-family:SimSun,serif;font-size:22px}header span{font-size:13px;color:#686b60}h1{font-family:SimSun,serif;font-size:clamp(32px,5vw,48px);font-weight:700;margin:25px 0 0;letter-spacing:2px}#view{height:min(54vh,490px);width:100%;position:relative;touch-action:none}canvas{display:block;width:100%;height:100%}#status{position:absolute;top:18px;left:0;color:#705b35;font-size:14px}#story{max-width:680px;margin:-14px auto 12px;font-family:SimSun,serif;font-size:clamp(23px,3vw,31px);line-height:2.1;text-align:center}button{font:inherit;cursor:pointer;border:1px solid #b7b49e;background:#faf5e9;color:inherit;padding:10px 20px;border-radius:28px;transition:background .15s,transform .15s}button:hover{background:#fff0ba}button:focus-visible{outline:3px solid #9b3e35;outline-offset:4px}.word{border:0;border-radius:5px;padding:0 2px;background:transparent;font:inherit;line-height:1.7;border-bottom:2px dotted #a9955d}.word.active{background:#f5d66d;border-color:transparent}.controls{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:18px}.primary{background:#294c42;color:#fff;border-color:#294c42}.primary:hover{background:#355d4c}small{display:block;text-align:center;line-height:1.7;color:#717365;margin:16px auto}#feedback{min-height:30px;margin:0;text-align:center;font-size:16px;color:#8f4b2d}.labels{display:flex;gap:8px;justify-content:center;font-size:14px;margin:10px}#error{display:none;padding:20px;color:#a43535}@media(max-width:600px){main{padding:18px 16px}#view{height:52vh}header span{font-size:11px}.controls{gap:8px}button{padding:9px 16px}}</style>
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js"}}</script>
<main><header><b>星光故事屋</b><span>原创中文互动绘本 · 超频视界实测</span></header><h1>小狐狸借星光</h1><div id="view"><div id="status">正在打开故事…</div></div><div id="error"></div><div id="story"></div><p id="feedback" aria-live="polite">点“小狐狸”或“星星”，看看会发生什么。</p><div class="controls"><button id="prev" aria-label="上一页">←</button><button id="read" class="primary">听这一页</button><button id="reset">再看一次</button><button id="next" aria-label="下一页">→</button></div><small id="page"></small><small>可以拖动视角，细看书里的世界。故事为虚构创作；这是三页交互原型。</small></main>
<script type="module">
import * as THREE from 'three';import{GLTFLoader}from './vendor/examples/jsm/loaders/GLTFLoader.js';
const view=document.querySelector('#view'),status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xeee7d9,0);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.95;renderer.shadowMap.enabled=true;view.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,.1,100);scene.add(new THREE.HemisphereLight(0xe6efff,0x8f7148,2.6));const key=new THREE.DirectionalLight(0xffe2b0,3);key.position.set(-3,7,5);scene.add(key);const fill=new THREE.DirectionalLight(0xc1dfff,1.7);fill.position.set(4,4,-3);scene.add(fill);
let model,star,head,fox,baseStar,baseHead,page=0,t0=0,event=null,angle=.08,drag=false,lastX=0;
const pages=[['小狐狸','来到','池塘','边。','一颗','星星，','落在水面上。'],['小狐狸','轻轻说：','“星星，','我送你回家吧。”'],['星星','慢慢升起，','小狐狸','挥挥手。','池塘','又映出了星光。']];
const audio=new Audio();let markers=[],clipEnd=null,wordPlayback=false;
const pageInk=document.createElement('canvas');pageInk.width=768;pageInk.height=1024;const pageCtx=pageInk.getContext('2d'),pageTexture=new THREE.CanvasTexture(pageInk);pageTexture.colorSpace=THREE.SRGBColorSpace;
const pagePanel=new THREE.Mesh(new THREE.PlaneGeometry(2.35,3.2),new THREE.MeshBasicMaterial({map:pageTexture,transparent:true,depthWrite:false}));pagePanel.rotation.x=-Math.PI/2;pagePanel.position.set(-1.39,.51,0);scene.add(pagePanel);
function paintPage(){pageCtx.clearRect(0,0,768,1024);pageCtx.fillStyle='#843a2e';pageCtx.font='50px SimSun';pageCtx.textAlign='center';pageCtx.fillText('小狐狸借星光',384,180);pageCtx.fillStyle='#342a20';pageCtx.font='58px SimSun';const lines=[['小狐狸来到池塘边。','一颗星星，','落在水面上。'],['小狐狸轻轻说：','“星星，','我送你回家吧。”'],['星星慢慢升起，','小狐狸挥挥手。','池塘又映出了星光。']][page];lines.forEach((line,i)=>pageCtx.fillText(line,384,370+i*130));pageTexture.needsUpdate=true;}
function renderText(){paintPage();wordPlayback=false;document.querySelector('#story').innerHTML=pages[page].map((w,i)=>`<button class="word" data-i="${i}" type="button">${w}</button>`).join('');document.querySelectorAll('.word').forEach(b=>b.onclick=()=>wordClick(Number(b.dataset.i)));document.querySelector('#page').textContent=`第 ${page+1} 页 / 共 3 页`;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page===2;audio.src=`page-${page+1}.mp3`;audio.load();markers=[];const pageAtRequest=page;fetch(`page-${page+1}-timings.json`).then(r=>r.ok?r.json():[]).then(d=>{if(page===pageAtRequest)markers=d;}).catch(()=>{});document.querySelector('#read').textContent='听这一页';}
function animateWord(w){event=w.includes('星星')?'star':w.includes('狐狸')?'fox':w.includes('池塘')?'pond':null;t0=performance.now();document.querySelector('#feedback').textContent=event==='star'?'星星亮起来，慢慢升上天空。':event==='fox'?'小狐狸抬头，向你打招呼。':event==='pond'?'靠近一点，看看池塘里的星光。':'再点一个词，或者听完整的一页。';}
function wordClick(i){audio.pause();wordPlayback=true;document.querySelector('#read').textContent='听这一页';const w=pages[page][i];animateWord(w);document.querySelectorAll('.word').forEach((b,j)=>b.classList.toggle('active',i===j));const m=markers[i];if(m){audio.currentTime=m.start;clipEnd=m.end;audio.play().catch(()=>document.querySelector('#feedback').textContent='声音暂时无法播放。');}else{document.querySelector('#feedback').textContent+='（该页配音待载入）';}}
function updateAudio(){if(clipEnd!==null&&audio.currentTime>=clipEnd){audio.pause();clipEnd=null;}document.querySelectorAll('.word').forEach((b,i)=>b.classList.toggle('active',!!markers[i]&&audio.currentTime>=markers[i].start&&audio.currentTime<markers[i].end));}audio.ontimeupdate=updateAudio;audio.onended=()=>{document.querySelector('#read').textContent='再听一遍';clipEnd=null;};
document.querySelector('#read').onclick=()=>{if(!audio.paused){audio.pause();document.querySelector('#read').textContent='继续听';return;}clipEnd=null;if(audio.ended||wordPlayback)audio.currentTime=0;wordPlayback=false;audio.play().then(()=>document.querySelector('#read').textContent='暂停').catch(()=>document.querySelector('#feedback').textContent='配音文件尚未载入，请稍后再听。');};
function goto(n){audio.pause();page=Math.max(0,Math.min(2,n));event=null;if(star&&baseStar)star.position.copy(baseStar);renderText();document.querySelector('#feedback').textContent='点文字，或者听这一页。';}
document.querySelector('#prev').onclick=()=>goto(page-1);document.querySelector('#next').onclick=()=>goto(page+1);document.querySelector('#reset').onclick=()=>{event=null;angle=.08;if(star)star.position.copy(baseStar);audio.pause();audio.currentTime=0;wordPlayback=false;clipEnd=null;document.querySelector('#read').textContent='听这一页';document.querySelectorAll('.word').forEach(b=>b.classList.remove('active'));document.querySelector('#feedback').textContent='故事回到这一页的开始。';};
new GLTFLoader().load('./fox-storybook.glb',g=>{model=g.scene;scene.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}if(o.name.startsWith('Story_text'))o.visible=false;if(o.name==='STAR')star=o;if(o.name==='FOX_HEAD')head=o;if(o.name==='FOX_ROOT')fox=o;});baseStar=star.position.clone();baseHead=head.rotation.clone();status.textContent='拖动看立体场景 · 点文字听故事';window.bookReady=true;window.bookEvidence={modelLoaded:true,starFound:!!star,foxFound:!!fox,pages:3};},undefined,e=>{document.querySelector('#error').style.display='block';document.querySelector('#error').textContent='模型未载入，请通过本地预览服务打开。';status.textContent='载入失败';console.error(e);});
function resize(){renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.fov=camera.aspect<1?55:40;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(view);
view.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;view.setPointerCapture(e.pointerId);});view.addEventListener('pointermove',e=>{if(drag){angle+=(e.clientX-lastX)*.003;angle=Math.max(-.5,Math.min(.5,angle));lastX=e.clientX;}});view.addEventListener('pointerup',()=>drag=false);
function frame(now){requestAnimationFrame(frame);if(!audio.paused)updateAudio();let radius=6.8,lookY=.5;const dt=(now-t0)/1000;if(star){star.rotation.y=.10*Math.sin(now/900);if(event==='star')star.position.y=baseStar.y+Math.min(1,dt/2)*1.1;else star.position.y=baseStar.y+Math.sin(now/1100)*.07;}if(head)head.rotation.z=baseHead.z+(event==='fox'&&dt<3?.25*Math.sin(dt*6):.025*Math.sin(now/900));if(event==='pond'&&dt<4){radius=6.2;lookY=.1;}camera.position.set(Math.sin(angle)*radius,5.5,Math.cos(angle)*radius);camera.lookAt(.2,lookY,0);renderer.render(scene,camera);}renderText();requestAnimationFrame(frame);
</script></html>
