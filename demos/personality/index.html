<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🐴 牛马人格测试</title>
<style>
:root{--bg:#0f0f1a;--card:#1a1a30;--accent:#ff4757;--gold:#ffa502;--green:#2ed573;--blue:#5352ed;--purple:#a55eea;--text:#f1f1f1;--sub:#999;--dim:#2a2a45}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.65}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;animation:fadeIn .5s ease}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes floatUp{0%{transform:translateY(100vh) rotate(0);opacity:0}10%{opacity:.25}90%{opacity:.25}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}
.container{max-width:540px;width:100%}.wide{max-width:640px}
.btn{padding:14px 34px;border-radius:30px;font-size:1.05rem;font-weight:700;cursor:pointer;border:none;transition:all .3s;letter-spacing:1px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#ff6b81);color:#fff;box-shadow:0 4px 20px rgba(255,71,87,.35);font-size:1.2rem;padding:16px 44px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 35px rgba(255,71,87,.55)}.btn-primary:active{transform:scale(.96)}
.industry-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;width:100%;max-width:480px}
.industry-card{background:var(--card);border:2px solid #333;border-radius:16px;padding:18px 14px;cursor:pointer;text-align:center;transition:all .25s}
.industry-card:hover{border-color:var(--accent);transform:translateY(-2px);background:#1e1e38}
.industry-card.selected{border-color:var(--gold);background:rgba(255,165,2,.08)}
.scene-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:20px 0;width:100%}
.scene-card{background:var(--card);border:2px solid #333;border-radius:14px;padding:14px 10px;cursor:pointer;text-align:center;transition:all .25s}
.scene-card:hover{border-color:var(--blue);background:#1e1e38}.scene-card.selected{border-color:var(--blue)}
.q-scene{background:var(--card);border-radius:16px;padding:20px;margin-bottom:18px;border:1px solid var(--dim);text-align:center}
.q-prompt{font-size:1.2rem;font-weight:700;text-align:center;margin-bottom:18px;line-height:1.5}
.option-btn{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;background:var(--card);border:2px solid #333;border-radius:14px;color:var(--text);font-size:.9rem;cursor:pointer;transition:all .2s;text-align:left;margin-bottom:10px}
.option-btn:hover{border-color:var(--accent);background:#1e1e38;transform:translateX(3px)}.option-btn:active{transform:scale(.98)}
.option-emoji{font-size:1.7rem;flex-shrink:0;width:36px;text-align:center}.option-text{flex:1}
.option-letter{background:var(--dim);color:var(--accent);min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
.progress-bar{height:7px;background:var(--dim);border-radius:10px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:10px;transition:width .5s ease}
.dim-bars{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:20px}
.dim-item{background:var(--card);border-radius:12px;padding:9px 12px;border:1px solid var(--dim)}
.dim-label{display:flex;justify-content:space-between;font-size:.7rem;margin-bottom:3px}.dim-label .l{color:var(--blue)}.dim-label .r{color:var(--accent)}
.dim-track{height:5px;background:var(--dim);border-radius:10px;overflow:hidden}
.dim-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--accent));border-radius:10px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.dim-score{font-size:.68rem;color:var(--sub);text-align:center}
.result-header{text-align:center;margin-bottom:20px}.result-emoji{font-size:5.5rem;animation:bounce 2s infinite;display:block}
.result-name{font-size:2rem;font-weight:900;margin:6px 0;background:linear-gradient(135deg,var(--gold),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-npu{color:var(--sub);font-size:.85rem;letter-spacing:2px}.result-tagline{color:var(--sub);font-size:.95rem;font-style:italic}
.conc-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.conc-emoji{font-size:1.2rem;width:40px;text-align:center}.conc-name{font-size:.8rem;width:36px;color:var(--sub)}
.conc-bar-wrap{flex:1;height:18px;background:var(--dim);border-radius:10px;overflow:hidden}
.conc-bar-fill{height:100%;border-radius:10px;transition:width 1s ease}
.conc-bar-fill::after{content:attr(data-pct);position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:.65rem;font-weight:700;color:#fff}
.conc-val{font-size:.75rem;width:36px;text-align:center;font-weight:700}
.analysis-section{background:var(--card);border-radius:16px;padding:20px;margin:14px 0;border:1px solid var(--dim)}
.analysis-section h4{font-size:.92rem;margin-bottom:10px}.analysis-section p,.analysis-section li{color:var(--sub);font-size:.85rem;line-height:1.7}
.trait-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.trait-card{background:rgba(255,255,255,.03);border-radius:12px;padding:14px;border:1px solid var(--dim)}
.bonus-trigger{text-align:center;margin:20px 0}
.btn-bonus{background:linear-gradient(135deg,#1a0a2e,#2a0a3e);color:var(--purple);border:2px solid var(--purple);font-size:1.1rem;padding:16px 40px;border-radius:30px;font-weight:700;cursor:pointer;animation:glowPulse 2s infinite}
@keyframes glowPulse{0%,100%{box-shadow:0 0 8px rgba(165,94,234,.3)}50%{box-shadow:0 0 30px rgba(165,94,234,.8)}}
.hidden-badge{display:inline-block;background:linear-gradient(135deg,var(--purple),var(--accent));color:#fff;border-radius:20px;padding:8px 18px;font-size:.85rem;font-weight:700;margin:8px 0}
.mate-row{display:flex;flex-wrap:wrap;gap:6px}.mate-tag{background:var(--card);border-radius:14px;padding:5px 12px;font-size:.78rem}
.mate-tag.good{border:1px solid var(--green);color:var(--green)}.mate-tag.bad{border:1px solid var(--accent);color:var(--accent)}
.share-row{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;justify-content:center}
.btn-retry{background:var(--card);color:var(--text);border:2px solid #555;padding:10px 22px;border-radius:25px;font-size:.9rem;font-weight:700;cursor:pointer}
.btn-copy{background:var(--green);color:#000;padding:10px 22px;border-radius:25px;font-size:.9rem;font-weight:700;cursor:pointer;border:none}
.credit{text-align:center;margin-top:30px;color:var(--sub);font-size:.75rem}.credit b{color:var(--text)}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.particle{position:absolute;animation:floatUp linear infinite;opacity:.25;font-size:1.4rem}
.tag{display:inline-block;background:var(--card);border:1px solid #333;border-radius:20px;padding:5px 13px;font-size:.78rem;color:var(--sub);margin:3px}
.tag.highlight{background:rgba(255,71,87,.15);border-color:var(--accent);color:var(--accent)}
@media(max-width:480px){.trait-grid{grid-template-columns:1fr}.industry-grid{grid-template-columns:1fr}.scene-grid{grid-template-columns:1fr 1fr}.dim-bars{grid-template-columns:1fr}.q-prompt{font-size:1.05rem}.option-btn{padding:12px 14px;font-size:.82rem}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>

<div class="screen active" id="screen-intro"><div class="container" style="text-align:center">
<span style="font-size:4.5rem;animation:bounce 2s infinite;display:block;margin-bottom:10px">🐴</span>
<h1 style="font-size:clamp(1.8rem,8vw,3rem);font-weight:900;background:linear-gradient(135deg,var(--gold),var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent">牛马人格测试</h1>
<p style="color:var(--sub);font-size:1rem;margin-bottom:24px">打工人の灵魂鉴定中心</p>
<button class="btn btn-primary" onclick="showIndustrySelect()" style="margin-top:20px">🚀 开始打工</button>
<button class="btn btn-secondary" onclick="showHistory()" style="margin-top:12px;background:var(--card);color:var(--text);border:2px solid #444;display:block;margin-left:auto;margin-right:auto">📋 查看记录</button>
</div></div>

<div class="screen" id="screen-industry"><div class="container" style="text-align:center">
<h2 style="font-size:1.5rem;margin-bottom:6px">先选你的行业</h2>
<p style="color:var(--sub);font-size:.9rem;margin-bottom:20px">每一题都跟你的行当相关</p>
<div class="industry-grid" id="industry-grid"></div>
<button class="btn btn-primary" id="btn-industry-confirm" disabled onclick="confirmIndustry()">✅ 确认行业</button>
</div></div>

<div class="screen" id="screen-level"><div class="container" style="text-align:center">
<div style="display:inline-block;background:var(--card);border:2px solid #444;border-radius:30px;padding:7px 18px;font-size:.85rem;color:var(--sub);margin-bottom:12px" id="level-badge"></div>
<div style="font-size:1.8rem;font-weight:900;margin-bottom:8px" id="level-title"></div>
<p style="font-size:.9rem;color:var(--sub);margin-bottom:14px">👇 选一个今天的剧情</p>
<div class="scene-grid" id="scene-grid"></div>
<div id="scene-tip" style="margin-top:12px;color:var(--sub);font-size:.7rem;text-align:center;line-height:1.6"></div>
<button class="btn btn-primary" onclick="startLevel()" style="margin-top:10px">🎮 开始答题</button>
</div></div>

<div class="screen" id="screen-history"><div class="container" style="text-align:center">
<h2 style="font-size:1.5rem;margin-bottom:6px">📋 测试记录</h2>
<p style="color:var(--sub);font-size:.85rem;margin-bottom:16px" id="history-count"></p>
<div id="history-list"></div>
<button class="btn btn-secondary" onclick="ss('intro')" style="margin-top:16px">🏠 返回首页</button>
</div></div>

<div class="screen" id="screen-question"><div class="container">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
<span style="font-size:.75rem;color:var(--sub)">第 <b id="qp-num" style="color:var(--text)">1</b>/30 题</span>
<span id="ql-name" style="font-size:.78rem;color:var(--sub)"></span>
<button onclick="if(confirm('确定重新开始？'))location.reload()" style="background:var(--dim);color:var(--sub);border:1px solid #444;border-radius:14px;padding:4px 12px;font-size:.7rem;cursor:pointer">↩ 重选</button>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:3%"></div></div>
<div class="q-scene"><div style="font-size:2.8rem;margin-bottom:8px" id="qs-emoji"></div><div style="color:var(--sub);font-size:.88rem" id="qs-text"></div></div>
<div class="q-prompt" id="qp-prompt"></div>
<div id="options-wrap"></div>
<div class="dim-bars" id="dim-live"></div>
</div></div>

<div class="screen" id="screen-result"><div class="container wide" id="result-content"></div></div>

<div class="screen" id="screen-bonus"><div style="background:linear-gradient(135deg,#120010,#1a0a20);border:3px solid var(--accent);border-radius:20px;padding:28px;width:100%;max-width:500px;text-align:center;animation:fadeIn .6s ease">
<div style="font-size:4.5rem;margin-bottom:8px">🚨</div><div style="font-size:1.5rem;font-weight:900;color:var(--accent);margin-bottom:6px">老板突击检查！</div>
<div style="color:var(--sub);margin-bottom:18px;font-size:.9rem" id="bonus-desc"></div>
<div class="q-scene"><div style="font-size:2.8rem;margin-bottom:8px" id="bns-emoji"></div><div style="color:var(--sub);font-size:.88rem" id="bns-text"></div></div>
<div class="q-prompt" id="bns-prompt"></div><div id="bns-options"></div>
</div></div>

<script>
const S={industry:-1,level:0,question:0,total:30,dims:[0,0,0,0,0,0],dimNames:['卷力','社交','执行','情绪','服从','危机'],dimLeft:['躺平','社恐','画饼','冷静','听话','跑路'],dimRight:['内卷','交际','实干','感性','反骨','救火'],dimEmojiL:['🦥','🦔','🎈','🧊','🐶','🏃'],dimEmojiR:['🔥','🦚','🔧','🌋','🦊','🦸'],bonusScore:0,sceneChosen:-1};
S.unlocked={0:true,1:true,2:true,3:true,4:true,5:true};S.poster=true;

const IND=[{e:'🏭',n:'工厂/制造',s:'流水线·打螺丝'},{e:'💼',n:'办公室/互联网',s:'码农·运营·HR'},{e:'📞',n:'销售/客服',s:'电销·门店·房产'},{e:'🍳',n:'餐饮/服务业',s:'厨师·服务员·零售'},{e:'🚚',n:'物流/外卖',s:'快递·外卖·仓储'},{e:'🌐',n:'通用/综合',s:'不限行业·通用职场'}];
const LV=[{id:1,name:'🏢 入职适应',scenes:[{e:'📋',t:'第一天报到'},{e:'☕',t:'午休闲聊'},{e:'📱',t:'微信群里'}]},{id:2,name:'📊 工作冲锋',scenes:[{e:'💼',t:'紧急任务'},{e:'🤝',t:'同事求助'},{e:'⏰',t:'加班通知'}]},{id:3,name:'🎉 人际战场',scenes:[{e:'🍺',t:'团建聚餐'},{e:'💬',t:'茶水八卦'},{e:'🎂',t:'人情世故'}]},{id:4,name:'🚨 危机时刻',scenes:[{e:'💥',t:'突发事故'},{e:'🫵',t:'被甩锅了'},{e:'💰',t:'待遇变动'}]},{id:5,name:'👑 年终大考',scenes:[{e:'📋',t:'评优述职'},{e:'🏆',t:'升职竞争'},{e:'🔮',t:'职业规划'}]}];

function showResult(){const code=mc(S.dims),td=TD[code]||['🤔','未知牛马','无法定义','谜之存在','生存本能','犹豫不决'];saveHistory(code,td);const[comp,clash]=getComp(code),clb=saveClb(code),CC=['#ff6b81','#ffa502','#2ed573','#5352ed','#a55eea','#ff4757'],CN=['内卷浓度','社交浓度','实干浓度','感性浓度','反骨浓度','担当浓度'];let concHTML='';for(let i=0;i<6;i++){const pct=Math.round((S.dims[i]+5)/10*100);concHTML+='<div class=\"conc-row\"><span class=\"conc-emoji\">'+S.dimEmojiR[i]+'</span><span class=\"conc-name\">'+CN[i]+'</span><div class=\"conc-bar-wrap\"><div class=\"conc-bar-fill\" data-pct=\"'+pct+'%\" style=\"width:'+pct+'%;background:'+CC[i]+'\"></div></div><span class=\"conc-val\" style=\"color:'+CC[i]+'\">'+pct+'%</span></div>'}const topT=[],weakT=[];for(let i=0;i<6;i++){const v=S.dims[i],abs=Math.abs(v);if(abs>=3){topT.push({icon:v>=0?S.dimEmojiR[i]:S.dimEmojiL[i],title:(v>=0?S.dimRight[i]:S.dimLeft[i])+(abs>=4?'型达人':'倾向'),desc:gtDesc(i)});weakT.push({icon:v>=0?S.dimEmojiR[i]:S.dimEmojiL[i],title:'过度'+(v>=0?S.dimRight[i]:S.dimLeft[i]),desc:gwDesc(i,v)})}}if(topT.length<3)for(let i=0;i<6;i++){const v=S.dims[i];if(Math.abs(v)>=1&&Math.abs(v)<3&&topT.length<5)topT.push({icon:v>=0?S.dimEmojiR[i]:S.dimEmojiL[i],title:'轻度'+(v>=0?S.dimRight[i]:S.dimLeft[i]),desc:gtDesc(i)})}if(weakT.length<2)for(let i=0;i<6;i++){const v=S.dims[i];if(Math.abs(v)>=1&&Math.abs(v)<3&&weakT.length<5)weakT.push({icon:v>=0?S.dimEmojiR[i]:S.dimEmojiL[i],title:'偏向'+(v>=0?S.dimRight[i]:S.dimLeft[i]),desc:gwDesc(i,v)})}let tagsHTML='';for(let i=0;i<6;i++){const v=S.dims[i],abs=Math.abs(v),pole=v>=0?S.dimRight[i]:S.dimLeft[i],emoji=v>=0?S.dimEmojiR[i]:S.dimEmojiL[i];tagsHTML+='<span class=\"tag'+(abs>=3?' highlight':'')+'\">'+emoji+' '+pole+(abs>=4?'⚡':abs>=2?'🔥':'')+'</span>'}const extraTags=[],totalAbs=S.dims.reduce((a,v)=>a+Math.abs(v),0);if(totalAbs>=20)extraTags.push('🏅 极端人格');else if(totalAbs<=10)extraTags.push('🎯 温和均衡');if(S.dims[0]>=4||S.dims[2]>=4)extraTags.push('💀 过劳预警');if(S.dims[0]<=-4)extraTags.push('😴 摸鱼王者');if(S.dims[4]>=3)extraTags.push('⚔️ 反骨先锋');if(S.dims[5]>=3)extraTags.push('🦸 危机担当');const npuCode='NPU-'+['J/T','Q/D','S/H','Q/L','F/G','Y/P'].map((l,i)=>l.split('/')[S.dims[i]>=0?0:1]).join(''),c=document.getElementById('result-content');c.innerHTML='<div class=\"result-header\"><span class=\"result-emoji\">'+td[0]+'</span><div class=\"result-npu\">'+npuCode+' · '+code+'</div><div class=\"result-name\">'+td[1]+'</div><div class=\"result-tagline\">&ldquo;'+td[2]+'&rdquo;</div></div>'+'<div class=\"analysis-section\"><h4>🧪 牛马浓度</h4>'+concHTML+'</div>'+'<div class=\"analysis-section\"><h4>📊 六维雷达</h4>'+genRadar()+'</div>'+'<div class=\"analysis-section\"><h4>🧭 职场象限</h4>'+genQuad()+'</div>'+'<div class=\"analysis-section\"><h4>🖼️ 人格画像</h4><p>'+td[3]+'</p></div>'+'<div class=\"trait-grid\"><div class=\"trait-card\"><div style=\"font-size:1.3rem\">💪</div><div style=\"font-weight:700;font-size:.85rem\">核心天赋</div><div style=\"color:var(--sub);font-size:.78rem\">'+td[4]+'</div></div><div class=\"trait-card\"><div style=\"font-size:1.3rem\">⚠️</div><div style=\"font-weight:700;font-size:.85rem\">潜在盲区</div><div style=\"color:var(--sub);font-size:.78rem\">'+td[5]+'</div></div></div>'+'<div class=\"analysis-section\"><h4>🏷️ 属性标签</h4><div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:8px\">'+tagsHTML+extraTags.map(t=>'<span class=\"tag highlight\">'+t+'</span>').join('')+'</div></div>'+(topT.length>0?'<div class=\"analysis-section\"><h4>✨ 突出特质</h4><div class=\"trait-grid\">'+topT.slice(0,4).map(t=>'<div class=\"trait-card\"><div style=\"font-size:1.3rem\">'+t.icon+'</div><div style=\"font-weight:700;font-size:.85rem\">'+t.title+'</div><div style=\"color:var(--sub);font-size:.78rem\">'+t.desc+'</div></div>').join('')+'</div></div>':'')+(weakT.length>0?'<div class=\"analysis-section\"><h4>🔍 需关注的倾向</h4><div class=\"trait-grid\">'+weakT.slice(0,4).map(t=>'<div class=\"trait-card\"><div style=\"font-size:1.3rem\">'+t.icon+'</div><div style=\"font-weight:700;font-size:.85rem\">'+t.title+'</div><div style=\"color:var(--sub);font-size:.78rem\">'+t.desc+'</div></div>').join('')+'</div></div>':'')+'<div class=\"analysis-section\"><h4>💡 这件事的意义</h4><p>'+genMean(code,td)+'</p></div>'+'<div class=\"analysis-section\"><h4>📖 职场生存指南 (卷'+S.dims[0]+' 社'+S.dims[1]+' 执'+S.dims[2]+' 情'+S.dims[3]+' 服'+S.dims[4]+' 危'+S.dims[5]+')</h4>'+genSurv(code)+'</div>'+'<div class=\"analysis-section\"><h4>💼 职业推荐</h4><p style=\"color:var(--sub);font-size:.85rem;line-height:1.8\">'+genJob(code)+'</p></div>'+'<div class=\"analysis-section\"><h4>💚 最佳拍档</h4><div class=\"mate-row\">'+comp.map(t=>'<span class=\"mate-tag good\">'+t+'</span>').join('')+'</div>'+(clash.length>0?'<h4 style=\"margin-top:12px\">⚡ 建议保持距离</h4><div class=\"mate-row\">'+clash.map(t=>'<span class=\"mate-tag bad\">'+t+'</span>').join('')+'</div>':'')+'</div>'+'<div class=\"analysis-section\" style=\"text-align:center\"><h4>📖 牛马图鉴</h4><p style=\"font-size:3rem;margin:8px 0\">📖</p><p style=\"color:var(--sub);font-size:.9rem\">已收集 <b style=\"color:var(--gold);font-size:1.2rem\">'+clb.total+'</b> / 64 种</p><div style=\"background:var(--dim);height:10px;border-radius:5px;margin:12px auto;max-width:300px\"><div style=\"height:100%;width:'+Math.round(clb.total/64*100)+'%;background:linear-gradient(90deg,#ffa502,#ff4757);border-radius:5px\"></div></div>'+(clb.lastCode&&clb.lastCode!==code?'<p style=\"color:var(--sub);font-size:.78rem;margin-top:8px\">上次你是 <b style=\"color:var(--accent)\">'+clb.lastName+'</b>，这次变了！</p>':'<p style=\"color:var(--sub);font-size:.78rem;margin-top:8px\">多测几次解锁全部图鉴！</p>')+'</div>'+'<div class=\"bonus-trigger\"><p style=\"color:var(--sub);margin-bottom:12px;font-size:.85rem\">还有隐藏标签未解锁</p><button class=\"btn btn-bonus\" onclick=\"startBonus()\">🔓 解锁隐藏标签</button></div>'+'<div class=\"share-row\"><button class=\"btn btn-retry\" onclick=\"location.reload()\">🔄 重新测试</button><button class=\"btn btn-copy\" onclick=\"copyResult()\">📋 复制结果</button><button class=\"btn\" style=\"background:var(--gold);color:#000;padding:10px 22px;border-radius:25px;font-size:.9rem;font-weight:700\" onclick=\"genPoster()\">'+'🎨 生成海报'+'</button></div>'+'<div class=\"credit\">作者：<b>Le</b><br>NPU 牛马人格测试 v4.1 · 仅供娱乐</div>';ss('result');setTimeout(()=>{const r=document.getElementById('screen-result');r.scrollTop=0;r.style.opacity='0';r.style.transform='translateY(15px)';r.style.transition='all .5s ease';setTimeout(()=>{r.style.opacity='1';r.style.transform='translateY(0)'},30)},10)}
function gtDesc(i){return[['拥有超强内驱力不需要别人催促'],['走到哪都是焦点社交是你的超能力'],['说到做到是你的招牌执行力就是正义'],['感性是你的天赋能感知别人忽略的情绪'],['坚持自己判断不盲从独立思考者'],['危急时刻你最可靠不逃避不退让']][i][0]}
function gwDesc(i,v){return[['太卷容易burnout别忘身体是本钱','过度休息可能被边缘化'],['独处虽好别完全封闭','社交过度可能显得浮夸'],['画饼也有保质期','太专注执行缺全局视角'],['太理性被觉得冷漠','情绪波动可能影响判断'],['服从有度不做提线木偶','不服从可能导致冲突'],['犹豫是最大成本','冲动可能不理性']][i][Math.abs(v)>=3?0:1]}
function genQuad(){const x=(S.dims[0]+5)/10*100,y=(S.dims[4]+5)/10*100;return'<div style=\"position:relative;width:240px;height:240px;margin:10px auto;border:2px solid #333;border-radius:12px;background:var(--card)\"><div style=\"position:absolute;left:50%;top:0;bottom:0;width:1px;background:#333\"></div><div style=\"position:absolute;top:50%;left:0;right:0;height:1px;background:#333\"></div><div style=\"position:absolute;top:8px;left:0;right:0;text-align:center;font-size:.7rem;color:var(--sub)\">反骨</div><div style=\"position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:.7rem;color:var(--sub)\">听话</div><div style=\"position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--sub)\">躺平</div><div style=\"position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--sub)\">内卷</div><div style=\"position:absolute;left:'+(220*x/100-8)+'px;top:'+(220*(1-y/100)-8)+'px;width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(255,71,87,.8)\"></div></div>'}
function genJob(code){const p=code.split('-'),jobs=[];if(p[0]==='J'){if(p[2]==='S')jobs.push('工程师/程序员');else jobs.push('项目经理/BP')}else{if(p[2]==='S')jobs.push('自由职业/设计师');else jobs.push('策划/顾问/作家')}if(p[1]==='Q'){if(p[3]==='Q')jobs.push('销售/BD/主播');else jobs.push('运营/HR/公关')}else{if(p[3]==='Q')jobs.push('独立创作者');else jobs.push('数据分析/研究员')}if(p[4]==='F'){if(p[5]==='Y')jobs.push('创业者/团队Leader');else jobs.push('独立顾问')}else{if(p[5]==='Y')jobs.push('公务员/体制内');else jobs.push('老师/行政/客服')}return'根据你的牛马人格，最适合的3个方向：<br><br>'+jobs.slice(0,3).map((j,i)=>'<b style=\"color:var(--gold)\">'+(i+1)+'.</b> '+j).join('<br>')+'<br><br><span style=\"font-size:.75rem;color:var(--sub)\">基于六维数据推算，仅供娱乐</span>'}
function genMean(code,td){return(td[6]||'你的牛马人格是这个时代的一面镜子。')+' 这份报告的意义不是贴标签，而是让你更清楚：你是谁、你擅长什么、你容易在哪翻车。认识自己是改变自己或接纳自己的第一步。'}
function genSurv(code){const p=code.split('-'),v=S.dims;let s='';if(v[0]>=4)s+='<li>你是卷王之王，但每周至少有一天彻底离线。没有人临终前会后悔没多加班。</li>';else if(v[0]>=2)s+='<li>适度努力是好事，别让加班变成习惯——加班往往是效率低下的遮羞布。</li>';else if(v[0]<=-4)s+='<li>摸鱼是艺术，但一直摸鱼会让你变成第一个被裁的人。偶尔也要亮剑。</li>';else if(v[0]<=-2)s+='<li>你的松弛感让人羡慕，但要记住：老板只会记住那个加班的人。</li>';else s+='<li>你在卷和躺之间找到了微妙的平衡——这是最难得的职场智慧。</li>';if(v[1]>=4)s+='<li>你是社交永动机，但说出去的每句话都是子弹——管住嘴，职场寿命翻倍。</li>';else if(v[1]>=2)s+='<li>社交是你的武器，精准连接比泛泛之交值钱一百倍。</li>';else if(v[1]<=-4)s+='<li>独处是充电，但职场是团队游戏。至少结交一个能帮你说话的盟友。</li>';else if(v[1]<=-2)s+='<li>你不需要变成交际花，但关键场合露个脸比你闷头干三个月都有用。</li>';else s+='<li>社交这件事你拿捏得刚刚好——该出现时出现，该隐身时隐身。</li>';if(v[2]>=4)s+='<li>执行力爆炸是好事，但记住：方向比速度重要。跑错了路，越快越远。</li>';else if(v[2]>=2)s+='<li>踏实的你让人放心，但别只顾低头拉车——偶尔也要抬头看看行业风向。</li>';else if(v[2]<=-4)s+='<li>饼画多了真的会饿死——今天必须完成一件实事，哪怕只是发一封邮件。</li>';else if(v[2]<=-2)s+='<li>策划能力是天赋，但论证一百遍不如动手做一遍。先开枪后瞄准也没错。</li>';else s+='<li>你在规划和执行之间切换自如——这是项目经理梦寐以求的能力。</li>';if(v[3]>=4)s+='<li>感性是你的超能力也是软肋。共情之前先保护好自己，你不是情绪垃圾桶。</li>';else if(v[3]>=2)s+='<li>你的温度让你成为团队的连接器，但重要决定要先用脑再走心。</li>';else if(v[3]<=-4)s+='<li>冷静到让人以为你是AI。偶尔展示一点脆弱和温度，会比想得更受欢迎。</li>';else if(v[3]<=-2)s+='<li>理性是你的护城河，但职场也是人情场——一句关心比一份报告更有用。</li>';else s+='<li>你的情商在一个完美区间——既有温度又不失理智，这是最难修炼的境界。</li>';if(v[4]>=4)s+='<li>反骨是你的底色，但反抗是为了改变不是逞快。出拳之前想好退路。</li>';else if(v[4]>=2)s+='<li>有主见是稀缺品质——反对的时候带上替代方案，杀伤力翻三倍。</li>';else if(v[4]<=-4)s+='<li>太听话会让你变成透明人。下周起，每周至少表达一次你的真实想法。</li>';else if(v[4]<=-2)s+='<li>配合度高是优势，但别让好说话变成你的标签。底线是用来守的。</li>';else s+='<li>你在服从与主见之间游刃有余——该低头时低头，该抬头时绝不含糊。</li>';if(v[5]>=4)s+='<li>危难时刻你是所有人的定心丸。但别习惯了救火，防火比救火更值钱。</li>';else if(v[5]>=2)s+='<li>你的担当让人敬佩，但拯救世界之前先确保自己不会成为陪葬品。</li>';else if(v[5]<=-4)s+='<li>跑得快是生存智慧，但每次都跑就没人再信任你了。</li>';else if(v[5]<=-2)s+='<li>谨慎让你活得更久，但该冲的时候不冲，机会就变成别人的上升通道。</li>';else s+='<li>你对风险的判断精准到可怕——这种人通常能活到最后，笑到最后。</li>';s+='<li>——记住：打工是为了生活，生活不是为了打工。</li>';return'<ul style=\"list-style:none;font-size:.85rem;color:var(--sub);line-height:2\">'+s+'</ul>'}
function genRadar(){const cx=150,cy=150,r=120,n=6,vals=S.dims.map(v=>(v+5)/10);let svg='<svg viewBox=\"0 0 300 300\" width=\"300\" height=\"300\"><g transform=\"translate('+cx+','+cy+')\">';for(let lv=1;lv<=5;lv++){let pts='';for(let i=0;i<n;i++){const a=-Math.PI/2+(2*Math.PI/n)*i;pts+=Math.round(r*lv/5*Math.cos(a))+','+Math.round(r*lv/5*Math.sin(a))+' '}svg+='<polygon points=\"'+pts+'\" fill=\"none\" stroke=\"#2a2a45\" stroke-width=\"1\"/>'}for(let i=0;i<n;i++){const a=-Math.PI/2+(2*Math.PI/n)*i;svg+='<line x1=\"0\" y1=\"0\" x2=\"'+Math.round(r*Math.cos(a))+'\" y2=\"'+Math.round(r*Math.sin(a))+'\" stroke=\"#2a2a45\" stroke-width=\"1\"/>'}let dpts='';for(let i=0;i<n;i++){const a=-Math.PI/2+(2*Math.PI/n)*i;dpts+=Math.round(vals[i]*r*Math.cos(a))+','+Math.round(vals[i]*r*Math.sin(a))+' '}svg+='<polygon points=\"'+dpts+'\" fill=\"rgba(255,71,87,.2)\" stroke=\"#ff4757\" stroke-width=\"2.5\"/>';for(let i=0;i<n;i++){const a=-Math.PI/2+(2*Math.PI/n)*i;svg+='<circle cx=\"'+Math.round(vals[i]*r*Math.cos(a))+'\" cy=\"'+Math.round(vals[i]*r*Math.sin(a))+'\" r=\"5\" fill=\"#ff4757\"/>'}for(let i=0;i<n;i++){const a=-Math.PI/2+(2*Math.PI/n)*i;svg+='<text x=\"'+Math.round((r+16)*Math.cos(a))+'\" y=\"'+Math.round((r+16)*Math.sin(a))+'\" text-anchor=\"middle\" fill=\"#aaa\" font-size=\"11\">'+S.dimNames[i]+'</text>'}for(let i=0;i<n;i++){const pct=Math.round(vals[i]*100),a=-Math.PI/2+(2*Math.PI/n)*i;svg+='<text x=\"'+Math.round((vals[i]*r+10)*Math.cos(a))+'\" y=\"'+Math.round((vals[i]*r+10)*Math.sin(a))+'\" text-anchor=\"middle\" fill=\"#ffa502\" font-size=\"10\" font-weight=\"700\">'+pct+'%</text>'}svg+='</g></svg>';return svg}
function getComp(code){const ps=code.split('-'),res=[[],[]];for(const[oc,data]of Object.entries(TD)){if(oc===code)continue;const ops=oc.split('-');let d=0;for(let i=0;i<6;i++)if(ps[i]!==ops[i])d++;if(d===1)res[0].push(data[0]+' '+data[1]);else if(d===5||d===6)res[1].push(data[0]+' '+data[1])}return[res[0].slice(0,4),res[1].slice(0,4)]}
function saveHistory(code,td){try{let hx=JSON.parse(localStorage.getItem('le_portfolio_demo_npu_history')||'[]');hx.unshift({code:code,name:td[1],emo:td[0],dims:[...S.dims],date:new Date().toLocaleDateString('zh-CN'),ind:S.industry});if(hx.length>20)hx=hx.slice(0,20);localStorage.setItem('le_portfolio_demo_npu_history',JSON.stringify(hx))}catch(e){}}
function showHistory(){const hx=JSON.parse(localStorage.getItem('le_portfolio_demo_npu_history')||'[]');document.getElementById('history-count').textContent=hx.length?'共 '+hx.length+' 条记录':'还没有测试记录，快去测一次吧！';const l=document.getElementById('history-list');l.innerHTML='';hx.forEach((r,i)=>{const c=document.createElement('div');c.style.cssText='background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;text-align:left;border:1px solid #333;cursor:pointer';c.innerHTML='<span style=font-size:2rem>'+r.emo+'</span> <b style=color:var(--gold)>'+r.name+'</b> <span style=color:var(--sub);font-size:.75rem;float:right>'+r.date+'</span><br><span style=color:var(--sub);font-size:.75rem>'+r.code+'</span>';c.onclick=()=>{S.dims=[...r.dims];S.industry=r.ind||0;showResult();history.back=()=>showHistory()};l.appendChild(c)});if(hx.length){const clr=document.createElement('button');clr.style.cssText='margin-top:12px;background:none;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:6px 16px;font-size:.75rem;cursor:pointer';clr.textContent='清除全部记录';clr.onclick=()=>{if(confirm('确定清除所有测试记录？')){localStorage.removeItem('le_portfolio_demo_npu_history');showHistory()}};l.appendChild(clr)}ss('history')}
function saveClb(code){try{let types=JSON.parse(localStorage.getItem('le_portfolio_demo_npu_collected')||'[]');if(!types.includes(code)){types.push(code);localStorage.setItem('le_portfolio_demo_npu_collected',JSON.stringify(types))}const prev=localStorage.getItem('le_portfolio_demo_npu_last'),lastCode=prev?JSON.parse(prev).code:null,lastName=prev?JSON.parse(prev).name:null;localStorage.setItem('le_portfolio_demo_npu_last',JSON.stringify({code,name:(TD[code]||['','?'])[1]}));return{total:types.length,lastCode,lastName}}catch(e){return{total:1,lastCode:null,lastName:null}}}

// Bonus
function startBonus(){S.bonusScore=0;renderB(0);ss('bonus')}
function renderB(step){const q=BQ[step];document.getElementById('bonus-desc').textContent='隐藏关 '+(step+1)+'/3';document.getElementById('bns-emoji').textContent=q.sc;document.getElementById('bns-text').textContent=q.st;document.getElementById('bns-prompt').textContent=q.p;const ow=document.getElementById('bns-options');ow.innerHTML='';const letters='ABC'.split('');q.o.forEach((opt,i)=>{const b=document.createElement('button');b.className='option-btn';b.innerHTML='<span class=\"option-emoji\">'+opt.e+'</span><span class=\"option-text\">'+opt.t+'</span><span class=\"option-letter\">'+letters[i]+'</span>';b.onclick=()=>{S.bonusScore+=opt.v;const next=step+1;if(next>=BQ.length){showBonusResult();return}renderB(next)};ow.appendChild(b)})}
function showBonusResult(){const total=S.bonusScore;let hidden='',emo='';if(total>=3){if(S.dims[4]>=3)hidden='😈 反骨卧底';else if(S.dims[0]>=3)hidden='🏅 全能战士';else hidden='👑 天选打工人';emo='在极端压力下你依然保持清醒。你不是普通的牛马，打工只是手段不是目的。'}else if(total>=1){if(S.dims[1]<=-2)hidden='🐺 孤狼操盘手';else if(S.dims[2]<=-2)hidden='🕊️ 和平主义者';else hidden='🦊 职场老油条';emo='你有自己的生存法则，未必教科书般正确但确实有效。'}else if(total>=-1){if(S.dims[3]>=3)hidden='💧 共情过载者';else if(S.dims[5]<=-2)hidden='🕳️ 战略性隐身';else hidden='😶 沉默的大多数';emo='你的谨慎避开了很多坑，但也可能错过了该站出来的时刻。'}else{if(S.dims[0]<=-3)hidden='🛌 躺平哲学家';else if(S.dims[4]>=3)hidden='⚡ 失控反骨仔';else hidden='🖤 黑化牛马';emo='你对现状不满，这恰恰说明内心深处还相信有更好的可能。'}const container=document.getElementById('result-content'),header=container.querySelector('.result-header'),badge=document.createElement('div');badge.className='hidden-badge';badge.textContent=hidden+' · 隐藏标签';badge.style.cssText='display:inline-block;margin:8px 0';header.appendChild(badge);const bs=document.createElement('div');bs.className='analysis-section';bs.innerHTML='<h4>🎭 隐藏标签揭秘</h4><p style=\"color:var(--sub);font-size:.88rem;line-height:1.7\">'+emo+'</p>';const bt=container.querySelector('.bonus-trigger');bt.parentNode.insertBefore(bs,bt);bt.style.display='none';ss('result');window.scrollTo(0,document.body.scrollHeight)}

// Copy & Poster
function copyResult(){const code=mc(S.dims),td=TD[code]||['🤔','未知牛马'],npu='NPU-'+['J/T','Q/D','S/H','Q/L','F/G','Y/P'].map((l,i)=>l.split('/')[S.dims[i]>=0?0:1]).join(''),bars=S.dimNames.map((n,i)=>{const pct=Math.round((S.dims[i]+5)/10*100),bar='█'.repeat(Math.round(pct/10))+'░'.repeat(10-Math.round(pct/10));return n+' ['+bar+'] '+pct+'%'}).join('\n'),text=td[0]+' '+td[1]+'\n代号：'+npu+' · '+code+'\n标签：「'+td[2]+'」\n\n'+'━'.repeat(12)+'\n📊 六维牛马浓度\n'+'━'.repeat(12)+'\n'+bars+'\n\n'+'━'.repeat(12)+'\n💪 天赋：'+td[3]+'\n⚠️ 盲区：'+td[4]+'\n💡 意义：'+(td[5]||'认识自己是改变或接纳自己的第一步')+'\n'+'━'.repeat(12)+'\n\n作者：Le\n测测你自己：牛马人格测试';if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>alert('✅ 已复制！分享给朋友吧！'))}
function genPoster(){if(!S.poster){showAd(()=>{S.poster=true;localStorage.setItem('le_portfolio_demo_npu_poster','1');showResult()});return}const W=540,H=960,code=mc(S.dims),td=TD[code]||['🤔','未知牛马'],cv=document.createElement('canvas');cv.width=W;cv.height=H;const X=cv.getContext('2d'),C=['#ff6b81','#ffa502','#2ed573','#5352ed','#a55eea','#ff4757'];X.fillStyle='#0a0a1a';X.fillRect(0,0,W,H);X.strokeStyle='#222';X.lineWidth=3;X.strokeRect(12,12,W-24,H-24);X.fillStyle='#f5c518';X.font='bold 22px \"PingFang SC\",\"Microsoft YaHei\"';X.textAlign='center';X.fillText('🐴 牛马人格测试 · 身份鉴定卡',W/2,65);X.fillStyle='#1a1a30';X.beginPath();X.arc(W/2,155,55,0,Math.PI*2);X.fill();X.strokeStyle='#f5c518';X.lineWidth=2;X.stroke();X.font='55px \"PingFang SC\",\"Microsoft YaHei\"';X.fillText(td[0],W/2,173);X.fillStyle='#f1f1f1';X.font='bold 38px \"PingFang SC\",\"Microsoft YaHei\"';X.fillText(td[1],W/2,240);X.fillStyle='#999';X.font='17px \"PingFang SC\",\"Microsoft YaHei\"';X.fillText('「'+td[2]+'」',W/2,272);X.strokeStyle='#2a2a45';X.beginPath();X.moveTo(50,300);X.lineTo(W-50,300);X.stroke();let y=330;X.fillStyle='#f1f1f1';X.font='bold 18px \"PingFang SC\",\"Microsoft YaHei\"';X.textAlign='left';X.fillText('📊 六维牛马浓度',50,y);y+=30;S.dimNames.forEach((n,i)=>{const pct=Math.round((S.dims[i]+5)/10*100);X.fillStyle='#aaa';X.font='15px \"PingFang SC\",\"Microsoft YaHei\"';X.fillText(S.dimEmojiR[i]+' '+n,50,y);const bx=140,bw=340;X.fillStyle='#1a1a30';X.fillRect(bx,y-12,bw,16);X.fillStyle=C[i];X.fillRect(bx,y-12,bw*pct/100,16);X.fillStyle='#fff';X.font='bold 12px \"PingFang SC\",\"Microsoft YaHei\"';X.textAlign='right';X.fillText(pct+'%',bx+bw-6,y+1);y+=34});y+=10;X.strokeStyle='#2a2a45';X.beginPath();X.moveTo(50,y);X.lineTo(W-50,y);X.stroke();y+=25;X.fillStyle='#f1f1f1';X.font='bold 18px \"PingFang SC\",\"Microsoft YaHei\"';X.fillText('💪 核心天赋',50,y);y+=28;X.fillStyle='#999';X.font='14px \"PingFang SC\",\"Microsoft YaHei\"';X.fillText(td[4],55,y,W-110);y+=40;X.fillStyle='#f1f1f1';X.font='bold 18px \"PingFang SC\",\"Microsoft YaHei\"';X.fillText('⚠️ 潜在盲区',50,y);y+=28;X.fillStyle='#999';X.font='14px \"PingFang SC\",\"Microsoft YaHei\"';X.fillText(td[5],55,y,W-110);y+=60;X.fillStyle='#1a1a30';X.fillRect(0,H-80,W,80);X.fillStyle='#aaa';X.font='14px \"PingFang SC\",\"Microsoft YaHei\"';X.textAlign='center';X.fillText('作者：Le',W/2,H-46);X.fillStyle='#666';X.font='12px \"PingFang SC\",\"Microsoft YaHei\"';X.fillText('原创趣味测试 · 仅供娱乐',W/2,H-20);const link=cv.toDataURL(),a=document.createElement('a');a.href=link;a.download='牛马身份卡_'+td[1]+'.png';a.click()}
